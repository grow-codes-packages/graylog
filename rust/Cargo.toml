# Created by sdk-kit 0.1.0; owned by this repository (keep the category features).
[package]
name = "grow-graylog"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
# MSRV-aware dependency resolution (picks versions that still build on rust-version).
resolver = "3"
description = "Rust SDK for Graylog Open by Grow Codes"
authors = ["Grow Codes <opensource@grow.codes>"]
license = "Apache-2.0"
homepage = "https://grow-codes-packages.github.io/graylog/"
repository = "https://github.com/grow-codes-packages/graylog"
documentation = "https://docs.rs/grow-graylog"
readme = "README.md"
keywords = ["grow-codes", "sdk", "graylog", "gelf", "logging"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "grow_graylog"
path = "src/lib.rs"

[features]
default = ["tracing-layer", "log-bridge"]
# Blocking wrapper (`blocking::GraylogClient`) that owns a one-worker multi-thread tokio
# runtime (background batching and exports keep running between blocking calls).
blocking = []
# In-memory fakes and the conformance runner (`testing` module).
testing = []
# `tracing_subscriber::Layer` that forwards tracing events to a `LogClient` (`LogLayer`).
tracing-layer = []
# `log::Log` implementation that forwards `log` records to a `LogClient` (`LogBridge`).
log-bridge = ["dep:log"]

[dependencies]
async-trait = "0.1.80"
bytes = "1.6"
futures = { version = "0.3.30", default-features = false, features = ["std", "async-await"] }
httpdate = "1.0"
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.11.1"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tokio-util = { version = "0.7.11", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = ["std", "attributes"] }
url = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "registry", "fmt"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
log = { version = "0.4.22", optional = true, features = ["std", "kv"] }
flate2 = "1.0.30"
regex = "1.10"
humantime = "2.1"
base64 = "0.23"
http = "1.1"
http-body-util = "0.1.2"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26.1", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
wiremock = "0.6"
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "fmt", "registry"] }
serde_json = "1.0.120"
hyper = { version = "1.5", features = ["server", "http2"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
bytes = "1.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(coverage_nightly)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
